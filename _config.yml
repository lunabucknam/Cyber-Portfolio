# Site settings
title: Luna Bucknam
email: lunabucknam@gmail.com
url: https://lunabucknam.github.io/cyber-Portfolio
description: "Portfolio of cybersecurity work samples for a junior-level cyber security professional."
keywords: "cybersecurity, cyber, security, portfolio, tech"
skills: "Cybersecurity - Analyst - Pen Tester"
meta_author: Bucknam Luna

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: 

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: f72585 #80B3FF
  primary-rgb: "247,37,133" #"128,179,255"
  secondary: 7209b7 #FD6E8A
  secondary-dark: 3a0ca3 #A2122F

# Footer settings
footer:
  copyright: Luna Bucknam
  location: Location
  social: Around the Web
  credits: Credits

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: linkedin
    url: www.linkedin.com/in/luna-bucknam-b9229340b
  - title: github
    url: https://github.com/lunabucknam

# Email Address (make sure to include "mailto:" before your email!)
email:
  email-url: mailto:lunabucknam@gmail.com

# Postal address (add as many lines as necessary)
location:
  - line: Warsaw, New York

# Credits content
credits: 'Freelancer is a free to use, open source Bootstrap theme created by <a href="http://startbootstrap.com">Start Bootstrap</a>.
Cyber icons created by <a href="https://www.flaticon.com/free-icons/cyber-attack" title="cyber attack icons">Freepik - Flaticon</a>.'

# Build settings
markdown: kramdown
permalink: pretty

#for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: ""
